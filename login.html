<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Admin Authentication - Smart Campus Lost &amp; Found</title>
 <link rel="stylesheet" href="/style.css?v=20261020_06">
</head>
<body>
 {{NAVBAR}}

 <main class="main-content">
 <div style="max-width: 480px; margin: 3rem auto;">
 {{ALERT}}

 <div class="form-card" style="box-shadow: var(--shadow-lg); border-top: 4px solid var(--primary); padding: 2.25rem;">
 <div style="text-align: center; margin-bottom: 1.75rem;">
 <div style="width: 64px; height: 64px; border-radius: 50%; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.75rem; border: 1px solid #bfdbfe;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
 <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a; margin-bottom: 0.35rem;">Admin Authentication</h1>
 <p style="color: #64748b; font-size: 0.9rem;">Protected portal for record lifecycle management, status updates, and database actions.</p>
 </div>

 <form action="/admin/login" method="POST">
 <div class="form-group">
 <label for="password">Administrator Password <span class="required">*</span></label>
 <input type="password" id="password" name="password" class="form-control" placeholder="Enter admin password" required autofocus>
 <span class="form-help">Default Key: <code>admin123</code></span>
 </div>

 <div style="margin-top: 1.5rem;">
 <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem;">
 Authenticate &amp; Access Dashboard
 </button>
 </div>
 </form>

 <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border); padding-top: 1rem;">
 <a href="/" class="btn btn-outline-dark btn-sm">&larr; Return to Student Portal</a>
 </div>
 </div>
 </div>
 </main>

 {{FOOTER}}
</body>
</html>
